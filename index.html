<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Markets</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --text:#e8ecf1; --muted:#8b95a5; --up:#22c55e; --down:#ef4444; --accent:#3b82f6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; max-width:960px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
  h1 { font-size:1.4rem; }
  .status { font-size:.8rem; padding:4px 12px; border-radius:999px; background:#1f2937; color:var(--muted); }
  .status.open { background:rgba(34,197,94,.15); color:var(--up); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:12px; padding:16px; }
  .card .name { font-size:.8rem; color:var(--muted); margin-bottom:6px; }
  .card .price { font-size:1.35rem; font-weight:700; }
  .card .chg { font-size:.85rem; margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .links { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
  .links a { background:var(--card); color:var(--text); text-decoration:none; padding:10px 18px; border-radius:10px; font-size:.9rem; }
  .links a:hover { background:#20262f; }
  .links a.primary { background:var(--accent); color:#fff; font-weight:600; }
  footer { margin-top:24px; font-size:.75rem; color:var(--muted); text-align:center; }
  .err { color:var(--down); font-size:.8rem; margin-top:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>My Markets</h1>
  <div>
    <span class="status" id="mktStatus">checking…</span>
    <span class="status" id="updated" style="margin-left:6px"></span>
  </div>
</header>

<div class="grid" id="cards"></div>
<div class="err" id="err"></div>

<div class="links">
  <a class="primary" href="https://login.upstox.com/" target="_blank" rel="noopener">Open Upstox</a>
  <a href="https://www.nseindia.com/" target="_blank" rel="noopener">NSE India</a>
  <a href="https://www.moneycontrol.com/" target="_blank" rel="noopener">Moneycontrol</a>
</div>

<footer>Data: Yahoo Finance (may be delayed) · Auto-refreshes every minute</footer>

<script>
const SYMBOLS = [
  { id:"%5ENSEI",    label:"Nifty 50" },
  { id:"%5EBSESN",   label:"Sensex" },
  { id:"%5ENSEBANK", label:"Bank Nifty" },
  { id:"INR%3DX",    label:"USD / INR" },
  { id:"GC%3DF",     label:"Gold (USD)" },
];

const cardsEl = document.getElementById("cards");
const errEl = document.getElementById("err");

SYMBOLS.forEach(s => {
  const d = document.createElement("div");
  d.className = "card"; d.id = "card-" + s.label.replace(/[^a-z]/gi,"");
  d.innerHTML = `<div class="name">${s.label}</div><div class="price">—</div><div class="chg">—</div>`;
  cardsEl.appendChild(d);
});

async function load() {
  errEl.style.display = "none";
  await Promise.all(SYMBOLS.map(async s => {
    try {
      const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${s.id}?interval=1d&range=2d`);
      const j = await r.json();
      const m = j.chart.result[0].meta;
      const price = m.regularMarketPrice;
      const prev = m.chartPreviousClose ?? m.previousClose;
      const chg = price - prev, pct = (chg / prev * 100);
      const cls = chg >= 0 ? "up" : "down";
      const sign = chg >= 0 ? "+" : "";
      const el = document.getElementById("card-" + s.label.replace(/[^a-z]/gi,""));
      el.querySelector(".price").textContent = price.toLocaleString("en-IN", {maximumFractionDigits:2});
      el.querySelector(".chg").innerHTML = `<span class="${cls}">${sign}${chg.toFixed(2)} (${sign}${pct.toFixed(2)}%)</span>`;
    } catch(e) {
      errEl.textContent = "Couldn't refresh some prices — will retry.";
      errEl.style.display = "block";
    }
  }));
  const now = new Date().toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"});
  document.getElementById("updated").textContent = "updated " + now;
}

function marketStatus() {
  // NSE: Mon–Fri, 9:15–15:30 IST
  const ist = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Kolkata"}));
  const day = ist.getDay(), mins = ist.getHours()*60 + ist.getMinutes();
  const open = day >= 1 && day <= 5 && mins >= 555 && mins < 930;
  const el = document.getElementById("mktStatus");
  el.textContent = open ? "● Market open" : "● Market closed";
  if (open) el.classList.add("open");
}

marketStatus();
load();
setInterval(load, 60000);
setInterval(marketStatus, 60000);
</script>
</body>
</html>
